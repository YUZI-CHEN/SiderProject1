<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>sideproject2</title>
    <!-- 引入 jQuery 庫 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
        .pagination button {
            padding: 8px 16px;
            margin: 0 4px;
            border: 1px solid #ddd;
            background-color: #f2f2f2;
            cursor: pointer;
        }
        .pagination button.active {
            background-color: #ddd;
        }
    </style>
    <script>
        $(document).ready(function() {
            var currentPage = 1;
            var itemsPerPage = 10;
            var data = [];

            function renderTable(page) {
                //獲取表格裡的jQuery對象
                var tableBody = $('#dataTable tbody');
                tableBody.empty(); // 清空表格

               //計算當前頁的起始索引和結束索引
                var startIndex = (page - 1) * itemsPerPage;
                var endIndex = Math.min(startIndex + itemsPerPage, data.length);
               //遍歷數據，從起始索引到結束索引，逐漸添加到表格中
                for (var i = startIndex; i < endIndex; i++) {
                    var item = data[i];
                    //創建一個新的表格行
                    var row = $('<tr></tr>');
                    // 添加影片編輯的單元格
                    row.append($('<td></td>').text(item.影片編號));
                    // 添加影片名稱的單元格 
                    row.append($('<td></td>').text(item.影片名稱));
                    // 添加片長的單元格 
                    row.append($('<td></td>').text(item.片長));
                    // 根據你的數據添加更多欄位
                    // 將創建好的添加到表格內
                    tableBody.append(row);
                }
                //  分頁按鈕
                renderPagination();
            }

     function renderPagination() {
            // 獲取分頁容器的jQuery對象   
                var pagination = $('.pagination');
                pagination.empty();
                // 計算總頁數
                var totalPages = Math.ceil(data.length / itemsPerPage);
            //    創建上一頁按鈕
                var prevButton = $('<button></button>').text('上一頁');
                if (currentPage === 1) {
                    // 如果當前頁是第一頁，不能用上一頁按鈕
                    prevButton.addClass('disabled');
                } else {
                    // 否則給上一頁按鈕添加點擊事件，點擊時跳到前一頁
                    prevButton.on('click', function() {
                        currentPage--;
                        renderTable(currentPage);
                    });
                }
            //   創建下一頁按鈕
                var nextButton = $('<button></button>').text('下一頁');
                if (currentPage === totalPages) {
                    // 如果當前頁為最後一頁禁用下一頁按鈕
                    nextButton.addClass('disabled');
                } else {
                    // 否則點擊下一頁按鈕進入下一頁
                    nextButton.on('click', function() {
                        currentPage++;
                        renderTable(currentPage);
                    });
                }
            //    創建頁碼訊息顯示
                var pageInfo = $('<span></span>').addClass('page-info').text('第 ' + currentPage + ' 頁，共 ' + totalPages + ' 頁');
            //   將上一頁按鈕、頁碼訊息和下一頁按鈕添加到分頁物件裡
                pagination.append(prevButton);
                pagination.append(pageInfo);
                pagination.append(nextButton);
            }

            $.ajax({
                type: 'GET',
                url: 'https://data.moa.gov.tw/service/opendata/VirtualMuseumAgri.aspx?IsTransData=1&UnitId=382',
                dataType: 'json',
                success: function(responseData) {
                    // 在這裡處理成功的結果
                    console.log(responseData);
                    data = responseData;
                    renderTable(currentPage);
                },
                error: function(jqXHR, textStatus, errorThrown) {
                    // 在這裡處理錯誤
                    console.error('Error: ' + textStatus, errorThrown);
                }
            });
        });
    </script>
</head>
<body>
    <table id="dataTable" border="1">
        <thead>
            <tr>
                <th>影片編號</th>
                <th>影片名稱</th>
                <th>片長</th>
                <!-- 根據你的數據添加更多標題 -->
            </tr>
        </thead>
        <tbody>
            <!-- 數據將插入到這裡 -->
        </tbody>
    </table>
    <div class="pagination"></div>
</body>
</html>
